# KHÔNG BẮT BUỘC. Chỉ dùng nếu bạn đã biết Docker và không muốn cài MySQL lên máy.
# Dùng file này thì cấu hình DB_PORT=3307, DB_USER, DB_PASSWORD, MYSQL_ROOT_PASSWORD trong .env.
#   Bật:   docker compose up -d
#   Tắt:   docker compose down        (dữ liệu vẫn giữ)
#   Xoá sạch dữ liệu: docker compose down -v
services:
  mysql:
    image: mysql:8.0
    container_name: ks25-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: Asia/Ho_Chi_Minh
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
