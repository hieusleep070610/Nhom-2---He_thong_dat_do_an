<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | foodie</title>
  <link rel="icon" href="../../assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/common/style.css">
</head>
<body class="foodie-body">
  <main class="auth-screen">
    <section class="auth-brand">
      <a class="fd-logo" href="../../index.html">
        <span class="fd-logo-name">foodie</span>
        <span class="fd-logo-tag">Ăn ngon mỗi ngày</span>
      </a>
      <h2>Ngon lành từng bữa, vui khỏe mỗi ngày</h2>
    </section>
    <section class="auth-card-wrap">
      <form class="auth-card" id="login-form">
        <h1>Đăng nhập</h1>
        <p class="lead">Nhập số điện thoại hoặc email để tiếp tục.</p>
        <p class="auth-error" id="login-error" hidden></p>
        <label class="auth-field">
          <span>Số điện thoại hoặc email</span>
          <span class="box"><input id="login-account" type="text" autocomplete="username" placeholder="09xx xxx xxx" required></span>
        </label>
        <label class="auth-field">
          <span>Mật khẩu</span>
          <span class="box">
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
            <button class="auth-eye" type="button" data-toggle-password="login-password">Hiện</button>
          </span>
        </label>
        <div class="auth-row">
          <label><input id="login-remember" type="checkbox" checked> Ghi nhớ đăng nhập</label>
          <a href="#" id="forgot-password">Quên mật khẩu?</a>
        </div>
        <button class="auth-submit" type="submit">Đăng nhập</button>
        <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../../js/config/config.js"></script>
  <script src="../../js/api/api.js"></script>
  <script src="../../js/pages/customer/auth.js"></script>
</body>
</html>
