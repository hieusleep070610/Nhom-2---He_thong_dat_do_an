<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Người dùng | KS25 Base</title>
  <link rel="icon" href="../assets/images/logo.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">
  <header id="app-header"></header>

  <main class="container layout-2col">
    <section class="card">
      <h2>Thêm người dùng</h2>
      <form id="user-form">
        <label for="full_name">Họ tên *</label>
        <input id="full_name" name="full_name" type="text" required minlength="2" maxlength="100" placeholder="VD: Nguyễn Văn A">

        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required maxlength="100" placeholder="a@example.com">

        <label for="password">Mật khẩu *</label>
        <input id="password" name="password" type="password" required minlength="8" placeholder="Tối thiểu 8 ký tự">

        <div class="form-actions">
          <button id="btn-submit" type="submit" class="btn btn-primary">Thêm</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Danh sách người dùng</h2>
        <input id="search-input" type="search" placeholder="Tìm theo tên hoặc email...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Họ tên</th>
              <th>Email</th>
              <th>Ngày tạo</th>
            </tr>
          </thead>
          <tbody id="user-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/pages/users.js"></script>
</body>
</html>
